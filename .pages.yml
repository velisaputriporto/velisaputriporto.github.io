# Pages CMS config (https://pagescms.org/docs/configuration/)
# Mirrors the fields in admin/config.yml. Field order matches the key order in
# data/*.json, because Pages CMS writes keys in the order fields are listed.

# Media root is the whole images/ folder so older photos stay pickable.
# Image fields open in images/uploads, so new uploads land there.
# rename: safe turns "My Photo 1.JPG" into "my-photo-1.jpg" on upload.
media:
  input: images
  output: /images
  rename: safe

content:
  - name: gallery
    label: "📸 Portfolio Photos"
    type: file
    path: data/gallery.json
    format: json
    fields:
      - name: photos
        label: "Photos (drag ⋮⋮ to reorder)"
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{alt}"
        fields:
          - name: image
            label: Photo
            type: image
            required: true
            options:
              path: images/uploads
          - name: alt
            label: Caption (visitors see this when a photo is enlarged)
            type: string
            default: Velisa Putri

  - name: videos
    label: "🎥 Videos"
    type: file
    path: data/videos.json
    format: json
    fields:
      - name: videos
        label: Videos
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{url}"
        fields:
          - name: url
            label: TikTok or Instagram video URL
            description: The link to one post, not a profile link.
            type: string
            required: true
          - name: caption
            label: Brand name (shown above the video)
            type: string

  - name: settings
    label: "⚙️ Bio & Contact"
    type: file
    path: data/site.json
    format: json
    fields:
      - { name: name, label: Name, type: string, required: true }
      - { name: tagline, label: "Hero Tagline (the last word gets the red pencil circle)", type: string, required: true }
      - { name: intro, label: Intro (short sentence under the tagline), type: text }
      - name: heroImage
        label: Hero Photo (the photo the top animation lands on)
        type: image
        required: true
        options:
          path: images/uploads
      - name: heroReel
        label: Hero Reel (photos it cycles through, 3 to 5 is best)
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{image}"
        fields:
          - name: image
            label: Photo
            type: image
            required: true
            options:
              path: images/uploads
      - name: aboutImage
        label: About Photo
        type: image
        required: true
        options:
          path: images/uploads
      - { name: bio, label: "Bio (leave a blank line between paragraphs)", type: text, required: true }
      - name: stats
        label: "Stats (height, sizes, and so on, shown at the top and in About)"
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{label}: {value}"
        fields:
          - { name: label, label: "Label, like Height or Based in", type: string, required: true }
          - { name: value, label: "Value, like 160 cm or Jakarta", type: string, required: true }
      - name: highlights
        label: What I do (the big list of services)
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{title} — {subtitle}"
        fields:
          - { name: title, label: Service name, type: string, required: true }
          - { name: subtitle, label: One-line description, type: string }
      - name: brands
        label: Brands (the moving coral band)
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{name}"
        fields:
          - { name: name, label: Brand name, type: string, required: true }
      - name: compCard
        label: "Comp card (the Download button, leave empty to hide it)"
        type: image
        options:
          path: images/uploads
      - { name: email, label: Email, type: string, required: true }
      - { name: instagram, label: Instagram handle (without @), type: string, required: true }
      - { name: tiktok, label: TikTok handle (without @), type: string, required: true }

# Commits made by invited editors show their name and email instead of the
# Pages CMS app's identity.
settings:
  commit:
    identity: user
