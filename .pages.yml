# Pages CMS config (https://pagescms.org/docs/configuration/)
# Mirrors the editable fields in data/*.json. Field order matches the key order in
# data/*.json, because Pages CMS writes keys in the order fields are listed.

# Media root is the whole images/ folder so older photos stay pickable.
# Image fields open in images/uploads, so new uploads land there.
# rename: safe turns "My Photo 1.JPG" into "my-photo-1.jpg" on upload.
media:
  input: images
  output: /images
  rename: safe

content:
  - name: gallery
    label: "📸 Portfolio Photos"
    type: file
    path: data/gallery.json
    format: json
    fields:
      - name: photos
        label: "Photos (drag ⋮⋮ to reorder)"
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{alt}"
        fields:
          - name: image
            label: Photo
            type: image
            required: true
            options:
              path: images/uploads
          - name: alt
            label: Caption (for accessibility)
            type: string
            default: Velisa Putri

  - name: videos
    label: "🎥 Videos"
    type: file
    path: data/videos.json
    format: json
    fields:
      - name: videos
        label: Videos
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{url}"
        fields:
          - name: url
            label: TikTok or Instagram video URL
            description: The link to one post, not a profile link.
            type: string
            required: true
          - name: caption
            label: Caption (optional, not shown publicly yet)
            type: string

  - name: settings
    label: "⚙️ Bio & Contact"
    type: file
    path: data/site.json
    format: json
    fields:
      - { name: name, label: Name, type: string, required: true }
      - { name: tagline, label: Hero Tagline, type: string, required: true }
      - name: heroImage
        label: Hero Photo (big photo at top)
        type: image
        required: true
        options:
          path: images/uploads
      - name: aboutImage
        label: About Photo
        type: image
        required: true
        options:
          path: images/uploads
      - { name: bio, label: "Bio (leave a blank line between paragraphs)", type: text, required: true }
      - name: highlights
        label: Highlight Cards (the little boxes under the bio)
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{title} — {subtitle}"
        fields:
          - { name: title, label: Title (bold top), type: string, required: true }
          - { name: subtitle, label: Subtitle (small text), type: string }
      - { name: email, label: Email, type: string, required: true }
      - { name: instagram, label: Instagram handle (without @), type: string, required: true }
      - { name: tiktok, label: TikTok handle (without @), type: string, required: true }

# Commits made by invited editors show their name and email instead of the
# Pages CMS app's identity.
settings:
  commit:
    identity: user
