backend:
  name: github
  repo: velisaputriporto/velisaputriporto.github.io
  branch: main
  base_url: https://sveltia-cms-auth.underarmy60.workers.dev

media_folder: "images/uploads"
public_folder: "/images/uploads"

site_url: /
display_url: /
logo_url: /images/velisa-04.jpg

collections:
  - name: "gallery"
    label: "📸 Portfolio Photos"
    description: "Add or remove the photos shown in the gallery. Drag to reorder."
    files:
      - name: "photos"
        label: "Gallery Photos"
        file: "data/gallery.json"
        format: "json"
        fields:
          - label: "Photos"
            name: "photos"
            label_singular: "Photo"
            widget: "list"
            summary: "{{fields.alt}}"
            fields:
              - { label: "Photo", name: "image", widget: "image" }
              - { label: "Caption (for accessibility)", name: "alt", widget: "string", required: false, default: "Velisa Putri" }

  - name: "videos"
    label: "🎥 Videos"
    description: "Paste a link to a TikTok or Instagram video (a single post's URL, not a profile link). Remove one to take it down."
    files:
      - name: "clips"
        label: "Video Links"
        file: "data/videos.json"
        format: "json"
        fields:
          - label: "Videos"
            name: "videos"
            label_singular: "Video"
            widget: "list"
            summary: "{{fields.url}}"
            fields:
              - { label: "TikTok or Instagram video URL", name: "url", widget: "string" }
              - { label: "Brand name (shown above the video)", name: "caption", widget: "string", required: false }

  - name: "settings"
    label: "⚙️ Bio & Contact"
    files:
      - name: "info"
        label: "Bio & Contact Info"
        file: "data/site.json"
        format: "json"
        fields:
          - { label: "Name", name: "name", widget: "string" }
          - { label: "Hero Tagline (the last word gets the red pencil circle)", name: "tagline", widget: "string" }
          - { label: "Intro (short sentence under the tagline)", name: "intro", widget: "text", required: false }
          - { label: "Hero Photo (the photo the top animation lands on)", name: "heroImage", widget: "image" }
          - label: "Hero Reel (photos it cycles through, 3 to 5 is best)"
            name: "heroReel"
            widget: "list"
            label_singular: "Photo"
            required: false
            fields:
              - { label: "Photo", name: "image", widget: "image" }
          - { label: "About Photo", name: "aboutImage", widget: "image" }
          - { label: "Bio (leave a blank line between paragraphs)", name: "bio", widget: "text" }
          - label: "Stats (height, sizes, and so on, shown at the top and in About)"
            name: "stats"
            widget: "list"
            label_singular: "Stat"
            summary: "{{fields.label}}: {{fields.value}}"
            required: false
            fields:
              - { label: "Label, like Height or Based in", name: "label", widget: "string" }
              - { label: "Value, like 160 cm or Jakarta", name: "value", widget: "string" }
          - label: "What I do (the big list of services)"
            name: "highlights"
            widget: "list"
            label_singular: "Service"
            summary: "{{fields.title}} — {{fields.subtitle}}"
            required: false
            fields:
              - { label: "Service name", name: "title", widget: "string" }
              - { label: "One-line description", name: "subtitle", widget: "string", required: false }
          - label: "Brands (the moving coral band)"
            name: "brands"
            widget: "list"
            label_singular: "Brand"
            summary: "{{fields.name}}"
            required: false
            fields:
              - { label: "Brand name", name: "name", widget: "string" }
          - { label: "Comp card (the Download button, leave empty to hide it)", name: "compCard", widget: "image", required: false }
          - { label: "Email", name: "email", widget: "string" }
          - { label: "Instagram handle (without @)", name: "instagram", widget: "string" }
          - { label: "TikTok handle (without @)", name: "tiktok", widget: "string" }
